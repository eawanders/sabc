name: Apply Supabase migrations

# Applies new files in supabase/migrations to the production database
# (Supabase project "sabc") after they merge to main. Needs one repository
# secret, SUPABASE_DB_URL: the project's Session pooler connection string with
# the database password filled in. It reaches only this database, unlike an
# account-wide Supabase access token. (The direct db.*.supabase.co host is
# IPv6-only, which GitHub runners can't reach, hence the pooler.)

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - name: Check the secret is set
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Set the SUPABASE_DB_URL repository secret (Session pooler connection string)"
            exit 1
          fi
      - name: Show pending migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
      - name: Apply migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
