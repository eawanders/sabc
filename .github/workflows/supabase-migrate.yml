name: Apply Supabase migrations

# Applies new files in supabase/migrations to the production database
# (Supabase project "sabc") after they merge to main. Needs two repository
# secrets: SUPABASE_ACCESS_TOKEN (Side Projects org) and SUPABASE_DB_PASSWORD.

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ajikllznzxotmrwojjnd
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - name: Check secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD must be set as repository secrets"
            exit 1
          fi
      - run: supabase link --project-ref "$PROJECT_REF"
      - name: Show pending migrations
        run: supabase db push --dry-run
      - name: Apply migrations
        run: supabase db push
